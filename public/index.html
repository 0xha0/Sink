<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s.gatsby.icu</title>
<meta name="description" content="Gatsby's short links.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9;
    --fg: #1c1917;
    --muted: #78716c;
    --line: #e7e5e4;
    --accent: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09;
      --fg: #f5f5f4;
      --muted: #a8a29e;
      --line: #292524;
      --accent: #5eead4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  }
  main { width: min(32rem, 100%); }
  h1 {
    margin: 0 0 .25rem;
    font-size: 2rem;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }
  p { margin: .5rem 0; }
  .lead { color: var(--muted); }
  .note {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
    font-size: .875rem;
    color: var(--muted);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 2rem; font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1><span>s</span>.gatsby.icu</h1>
  <p class="lead">Gatsby 的短链接 · Short links by Gatsby</p>
  <div class="note">
    <p>这里的每个短链接都会跳转到它指向的地址；已过期或不存在的链接返回 404。</p>
    <p>Each short link here forwards to its destination; an expired or unknown one ends in a 404.</p>
    <p><a href="https://gatsby.icu">gatsby.icu</a></p>
  </div>
  <footer>
    Runs <a href="https://github.com/0xha0/Sink">Sink</a> (AGPL-3.0), source of this deployment:
    <a href="https://github.com/0xha0/Sink/tree/gatsby">github.com/0xha0/Sink</a>
  </footer>
</main>
</body>
</html>
